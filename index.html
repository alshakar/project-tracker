<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F5F5">
  <title>Project Follow-up Tracker</title>
  <style>
    @font-face{font-family:"IBM Plex Sans";src:url("fonts/ibm-plex-sans-regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
    @font-face{font-family:"IBM Plex Sans";src:url("fonts/ibm-plex-sans-semibold.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
    @font-face{font-family:"IBM Plex Sans Arabic";src:url("fonts/ibm-plex-sans-arabic-regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
    @font-face{font-family:"IBM Plex Sans Arabic";src:url("fonts/ibm-plex-sans-arabic-semibold.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
    :root{--page:#F5F5F5;--card:#FFFFFF;--text:#242424;--secondary:#424242;--meta:#616161;--primary:#0F6CBD;--primaryText:#FFFFFF;--link:#0F6CBD;--overdue:#B10E1C;--overdueTint:#FDF3F4;--overdueStripe:#C50F1F;--soon:#BC4B09;--soonTint:#FFF9F5;--done:#0E700E;--doneTint:#F1FAF1;--divider:#E0E0E0;--focus:#000000;--shadow:0 0 2px rgba(0,0,0,.12),0 2px 4px rgba(0,0,0,.14);--radius:8px}
    [data-theme="dark"]{--page:#1F1F1F;--card:#292929;--text:#FFFFFF;--secondary:#D6D6D6;--meta:#ADADAD;--primary:#115EA3;--link:#479EF5;--overdue:#DC626D;--overdueTint:#3B0509;--overdueStripe:#DC626D;--soon:#F98845;--soonTint:#4A1E04;--done:#54B054;--doneTint:#052505;--divider:#525252;--focus:#FFFFFF;--shadow:none}
    *{box-sizing:border-box}
    [hidden]{display:none!important}
    html,body{margin:0;min-height:100%;background:var(--page);color:var(--text);font-family:"IBM Plex Sans","IBM Plex Sans Arabic","Segoe UI",-apple-system,Roboto,sans-serif;font-size:16px;line-height:24px;font-weight:400}
    html[lang="ar"] body{line-height:26px}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.55}
    :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
    .bdi{unicode-bidi:plaintext}
    .app{max-width:1200px;margin:auto;padding:env(safe-area-inset-top) 16px calc(88px + env(safe-area-inset-bottom))}
    .topbar{height:72px;display:flex;align-items:center;gap:8px}
    .project-switch{min-height:48px;border:0;background:transparent;color:var(--text);display:flex;align-items:center;gap:8px;font-size:20px;font-weight:600;padding:8px}
    .top-actions{margin-inline-start:auto;display:flex;gap:4px}
    .icon-button,.text-button,.primary,.secondary{min-height:48px;border-radius:8px;border:1px solid var(--divider);background:var(--card);color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 16px}
    .icon-button{width:48px;padding:8px}
    .icon{width:20px;height:20px;display:block;fill:currentColor}
    .primary{border-color:var(--primary);background:var(--primary);color:var(--primaryText);font-weight:600}
    .secondary{font-weight:400}
    .top-add{display:none}
    .counters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
    .counter{min-height:64px;border:0;border-radius:8px;padding:8px 12px;text-align:start;color:var(--text)}
    .counter strong{display:block;font-size:20px;line-height:28px}
    .counter.overdue{background:var(--overdueTint);color:var(--overdue)}
    .counter.soon{background:var(--soonTint);color:var(--soon)}
    .counter.done{background:var(--doneTint);color:var(--done)}
    [data-theme="dark"] .counter.overdue{color:var(--overdue)}[data-theme="dark"] .counter.soon{color:var(--soon)}[data-theme="dark"] .counter.done{color:var(--done)}
    .filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}
    .pill{min-height:48px;border:1px solid var(--divider);border-radius:24px;background:var(--card);color:var(--text);padding:8px 16px;white-space:nowrap}
    .pill.active{background:var(--text);color:var(--page);border-color:var(--text)}
    .group{margin-top:8px}
    .group-head{display:flex;align-items:center;justify-content:space-between;min-height:48px}
    .group-head h2{margin:0;font-size:20px;line-height:28px;font-weight:600}
    .grid{display:grid;grid-template-columns:1fr;gap:12px}
    .card{position:relative;background:var(--card);border-radius:8px;box-shadow:var(--shadow);padding:16px}
    [data-theme="dark"] .card{border:1px solid var(--divider);box-shadow:none}
    .card.overdue{border-inline-start:4px solid var(--overdueStripe)}
    .card-title{border:0;background:transparent;padding:0;color:var(--text);font-size:20px;line-height:28px;font-weight:600;text-align:start}
    .meta-row{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--meta);font-size:14px;line-height:20px}
    html[lang="ar"] .meta-row{line-height:22px}
    .avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--divider);color:var(--text);font-weight:600;flex:none}
    .card-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
    .badge{border-radius:16px;padding:4px 8px;font-size:14px;line-height:20px;font-weight:600}
    .badge.overdue{background:var(--overdueTint);color:var(--overdue)}
    .badge.soon{background:var(--soonTint);color:var(--soon)}
    .badge.done{background:var(--doneTint);color:var(--done)}
    .follow-btn{width:100%;margin-top:12px}
    .floating{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:56px;height:56px;border:0;border-radius:50%;background:var(--primary);color:#fff;font-size:28px;line-height:28px;box-shadow:var(--shadow);z-index:20}
    [dir="rtl"] .floating{inset-inline-end:auto;inset-inline-start:16px}
    .banner{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--divider);background:var(--card);padding:8px 12px;border-radius:8px;margin-bottom:8px}
    .empty{text-align:center;padding:32px 16px}
    .empty .primary,.empty .secondary{margin-top:8px}
    .link{border:0;background:transparent;color:var(--link);min-height:48px;padding:8px;text-decoration:underline}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:flex-end}
    .overlay.hidden{display:none}
    .dialog{background:var(--card);color:var(--text);width:100%;max-height:92vh;overflow:auto;border-radius:8px 8px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
    [data-theme="dark"] .dialog{border:1px solid var(--divider);box-shadow:none}
    .dialog-head{display:flex;align-items:center;justify-content:space-between;min-height:48px}
    .dialog-head h2{font-size:20px;line-height:28px;margin:0}
    .form-grid{display:grid;gap:12px}
    .field label{display:block;font-weight:600;margin-bottom:4px}
    .field input,.field textarea,.field select{width:100%;min-height:48px;border:1px solid var(--divider);border-radius:8px;background:var(--page);color:var(--text);padding:8px 12px}
    .field textarea{min-height:140px;resize:vertical}
    .field.invalid input,.field.invalid textarea,.field.invalid select{border:2px solid var(--overdue)}
    .error{color:var(--overdue);font-size:14px;line-height:20px;min-height:20px}
    .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
    .actions>*{flex:1}
    .tone-row{display:flex;flex-wrap:wrap;gap:8px}
    .tone{min-height:48px;border:1px solid var(--divider);border-radius:24px;background:var(--card);color:var(--text);padding:8px 12px}
    .tone.active{border:2px solid var(--primary);color:var(--primary)}
    .project-list{display:grid}
    .project-row{min-height:48px;display:flex;align-items:center;justify-content:space-between;border:0;border-bottom:1px solid var(--divider);background:transparent;color:var(--text);padding:8px}
    .count-tint{border-radius:16px;background:var(--overdueTint);color:var(--overdue);padding:4px 8px}
    .detail-row{border-bottom:1px solid var(--divider);padding:8px 0}
    .undo-bar{position:fixed;z-index:200;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom));min-height:56px;border-radius:8px;background:#242424;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 16px}
    .undo-bar button{color:#479EF5}
    @media(min-width:600px){.app{padding-inline:24px}.overlay{align-items:center;justify-content:center}.dialog{width:min(560px,calc(100vw - 48px));max-height:calc(100vh - 48px);border-radius:8px;padding:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top-add{display:inline-flex}.floating{display:none}.actions>*{flex:0 0 auto}}
    @media(min-width:1024px){.app{padding-inline:32px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <div id="overlay" class="overlay hidden" aria-hidden="true"></div>
  <div id="live" aria-live="polite" class="bdi" style="position:absolute;width:1px;height:1px;overflow:hidden"></div>
  <script>
  // STATE
  const STORAGE_KEY="followup-tracker:v1";
  let storageBlocked=false, unreadable=false, undoAction=null, undoTimer=null, openModal=null, previousFocus=null;
  const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
  const toISO=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const fromISO=s=>{const [y,m,d]=s.split("-").map(Number);const x=new Date(y,m-1,d);x.setHours(0,0,0,0);return x};
  const uid=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2);
  const state={projects:[],items:[],settings:{theme:"system",lang:null,digits:"latn",yourName:"",currentProjectId:null},filter:"all"};

  // TRANSLATIONS
  const T={
   en:{app:"Project Follow-up Tracker",settings:"Settings",add:"Add deliverable",follow:"Follow up",reopen:"Reopen",overdue:"Overdue",dueWeek:"Due this week",done:"Done",all:"All",mine:"Mine",dueSoon:"Due soon",later:"Later",nothingOverdue:"Nothing overdue. Nice.",noItems:"No deliverables yet. Add the first one and we'll keep track of who owes what.",createProject:"Create your first project",noFilter:"No items match this filter",clear:"Clear filter",gentle:"Gentle nudge",reminder:"Reminder",escalate:"Escalate",send:"Send",copy:"Copy",copied:"Copied",save:"Save",cancel:"Cancel",edit:"Edit",delete:"Delete",markDone:"Mark done",changeDate:"Change date",noFollowUps:"No follow-ups yet",sendDisabled:"Add a contact to send directly",theme:"Theme",system:"System",light:"Light",dark:"Dark",language:"Language",matchBrowser:"Match browser",digits:"Digits",latn:"Western 0–9",arab:"Eastern Arabic ٠–٩",yourName:"Your name",reset:"Reset to sample data",newProject:"New project",rename:"Rename",projectName:"Project name",title:"Title",owner:"Owner",contact:"Owner contact",dueDate:"Due date",project:"Project",notes:"Notes",requiredTitle:"Add a title",requiredOwner:"Add an owner",requiredDate:"Add a due date",pastWarning:"This will show as overdue straight away.",invalidContact:"Enter a valid email or phone number.",saveFail:"Couldn't save. Try again",retry:"Retry",didSend:"Did you send it?",yes:"Yes",notYet:"Not yet",shareCancel:"Copy instead",copyFail:"Couldn't copy. Select the text and copy it manually.",unreadable:"Your saved data couldn't be read.",startFresh:"Start fresh",deleteConfirm:"Delete this item?",projectDeleteConfirm:"Deleting this project removes its items.",undo:"Undo",undoItem:"Deliverable deleted",undoProject:"Project deleted",loadSamples:"Load sample data",storageOff:"Saving is off in this browser. Your changes will be lost when you close this page.",day:"day",days:"days",ago:"ago",dueToday:"is due today",dueOn:"is due on",wasDue:"was due",sent:"Follow-up sent",log:"Reminder sent",followUps:"Follow-up log",addContact:"Add a contact",close:"Close",more:"More",deleteItem:"Delete item",changeDateTitle:"Change due date",renameProject:"Rename project",deleteProject:"Delete project",confirmReset:"Reset to sample data?",sampleReset:"Sample data restored"},
   ar:{app:"متتبع متابعة المشاريع",settings:"الإعدادات",add:"إضافة مُخرج",follow:"متابعة",reopen:"إعادة فتح",overdue:"متأخر",dueWeek:"مستحق هذا الأسبوع",done:"تم",all:"الكل",mine:"لي",dueSoon:"مستحق قريبًا",later:"لاحقًا",nothingOverdue:"لا يوجد شيء متأخر. رائع.",noItems:"لا توجد مُخرجات بعد. أضف الأولى وسنتابع معك من عليه.",createProject:"أنشئ مشروعك الأول",noFilter:"لا توجد عناصر تطابق هذا المرشح",clear:"مسح المرشح",gentle:"تذكير لطيف",reminder:"تذكير",escalate:"تصعيد",send:"إرسال",copy:"نسخ",copied:"تم النسخ",save:"حفظ",cancel:"إلغاء",edit:"تعديل",delete:"حذف",markDone:"وضع علامة تم",changeDate:"تغيير التاريخ",noFollowUps:"لا توجد متابعات بعد",sendDisabled:"أضف جهة اتصال للإرسال مباشرة",theme:"المظهر",system:"النظام",light:"فاتح",dark:"داكن",language:"اللغة",matchBrowser:"مطابقة المتصفح",digits:"الأرقام",latn:"غربية 0–9",arab:"عربية ٠–٩",yourName:"اسمك",reset:"إعادة بيانات المثال",newProject:"مشروع جديد",rename:"إعادة تسمية",projectName:"اسم المشروع",title:"العنوان",owner:"المسؤول",contact:"جهة اتصال المسؤول",dueDate:"تاريخ الاستحقاق",project:"المشروع",notes:"ملاحظات",requiredTitle:"أضف عنوانًا",requiredOwner:"أضف اسم المسؤول",requiredDate:"أضف تاريخ الاستحقاق",pastWarning:"سيظهر هذا كعنصر متأخر مباشرة.",invalidContact:"أدخل بريدًا إلكترونيًا أو رقم هاتف صالحًا.",saveFail:"تعذر الحفظ. حاول مرة أخرى",retry:"إعادة المحاولة",didSend:"هل أرسلت الرسالة؟",yes:"نعم",notYet:"ليس بعد",shareCancel:"نسخ بدلًا من ذلك",copyFail:"تعذر النسخ. حدّد النص وانسخه يدويًا.",unreadable:"تعذر قراءة بياناتك المحفوظة.",startFresh:"ابدأ من جديد",deleteConfirm:"حذف هذا العنصر؟",projectDeleteConfirm:"حذف هذا المشروع يحذف عناصره.",undo:"تراجع",undoItem:"تم حذف المُخرج",undoProject:"تم حذف المشروع",loadSamples:"تحميل بيانات المثال",storageOff:"الحفظ متوقف في هذا المتصفح. ستفقد تغييراتك عند إغلاق الصفحة.",day:"يوم",days:"أيام",ago:"مضت",dueToday:"موعد التسليم اليوم",dueOn:"موعد التسليم في",wasDue:"كان موعد التسليم قبل",sent:"تم إرسال المتابعة",log:"تم إرسال تذكير",followUps:"سجل المتابعات",addContact:"إضافة جهة اتصال",close:"إغلاق",more:"المزيد",deleteItem:"حذف العنصر",changeDateTitle:"تغيير تاريخ الاستحقاق",renameProject:"إعادة تسمية المشروع",deleteProject:"حذف المشروع",confirmReset:"إعادة بيانات المثال؟",sampleReset:"تمت استعادة بيانات المثال"}
  };
  Object.assign(T.en,{exportJSON:"Export as JSON",importJSON:"Import JSON",importConfirm:"Replace your current projects and deliverables with this imported data?",importInvalid:"The selected file isn't valid tracker JSON.",imported:"JSON data imported"});
  Object.assign(T.ar,{exportJSON:"تصدير بصيغة JSON",importJSON:"استيراد JSON",importConfirm:"هل تريد استبدال المشاريع والمُخرجات الحالية بهذه البيانات المستوردة؟",importInvalid:"الملف المحدد ليس JSON صالحًا للمتتبع.",imported:"تم استيراد بيانات JSON"});
  function lang(){return state.settings.lang||(navigator.language.startsWith("ar")?"ar":"en")}
  function tr(k){return T[lang()][k]||T.en[k]||k}
  function number(n){return new Intl.NumberFormat(lang(),{numberingSystem:state.settings.digits}).format(n)}
  function plural(n,key){if(lang()=="ar"){const p=new Intl.PluralRules("ar",{numberingSystem:state.settings.digits}).select(n);return p=="one"?tr("day"):tr("days")}return n==1?tr("day"):tr("days")}
  function dateText(d){return new Intl.DateTimeFormat(lang(),{day:"numeric",month:"short",numberingSystem:state.settings.digits}).format(d)}

  // STORAGE
  function load(){
    try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const parsed=JSON.parse(raw);if(parsed.version!==1||!Array.isArray(parsed.projects)||!Array.isArray(parsed.items))throw Error();Object.assign(state,parsed);if(!parsed.settings.lang)state.settings.lang=navigator.language.startsWith("ar")?"ar":"en"}else stateLoadSamples()}
    catch(e){unreadable=true;stateLoadSamples()}
  }
  function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({version:1,projects:state.projects,items:state.items,settings:state.settings}));storageBlocked=false}catch(e){storageBlocked=true}}
  function stateLoadSamples(){
    const add=(n)=>{const d=today();d.setDate(d.getDate()+n);return toISO(d)};
    const en=lang()=="en";
    const projects=[{id:"p1",name:en?"Website relaunch":"إطلاق الموقع الجديد"},{id:"p2",name:en?"Office move":"نقل المكتب"}];
    const home=[
      ["i1","p1","Homepage copy","سارة حداد","sara@example.com",-9,false],
      ["i2","p1","Brand photos","عمر خليل","omar@example.com",-4,false],
      ["i3","p1","Analytics setup","لينا منصور","",-1,false],
      ["i4","p1","Accessibility review","يوسف درويش","yousef@example.com",0,false],
      ["i5","p1","Launch email","مايا تشين","maya@example.com",5,false],
      ["i6","p1","Final sign-off","دانيال بروكس","daniel@example.com",14,false],
      ["i7","p1","Sitemap","سارة حداد","sara@example.com",-20,true]
    ];
    const office=[["i8","p2","Floor plan","عمر خليل","omar@example.com",-2,false],["i9","p2","IT equipment list","لينا منصور","lina@example.com",3,false],["i10","p2","Movers' quote","دانيال بروكس","daniel@example.com",10,false]];
    const ownerNames={ "سارة حداد":"Sara Haddad","عمر خليل":"Omar Khalil","لينا منصور":"Lina Mansour","يوسف درويش":"Yousef Darwish","مايا تشين":"Maya Chen","دانيال بروكس":"Daniel Brooks"};
    const items=[...home,...office].map(x=>({id:x[0],projectId:x[1],title:en?x[2]:({ "Homepage copy":"الصفحة الرئيسية","Brand photos":"صور العلامة التجارية","Analytics setup":"إعداد التحليلات","Accessibility review":"مراجعة سهولة الوصول","Launch email":"البريد الإلكتروني للإطلاق","Final sign-off":"اعتماد نهائي","Sitemap":"خريطة الموقع","Floor plan":"المخطط الطابقي","IT equipment list":"قائمة معدات تقنية المعلومات","Movers' quote":"عرض أسعار النقل"}[x[2]]||x[2]),owner:en?(ownerNames[x[3]]||x[3]):x[3],contact:x[4],due:add(x[5]),notes:"",done:x[6],doneAt:x[6]?toISO(today()):null,followUps:x[0]=="i1"?[{at:new Date(Date.now()-86400000*2).toISOString(),tone:"reminder"}]:[]}));
    state.projects=projects;state.items=items;state.settings={theme:"system",lang:lang(),digits:"latn",yourName:"",currentProjectId:"p1"};
  }

  // STATUS AND CONTENT
  function dayDiff(item){const d=fromISO(item.due);d.setHours(0,0,0,0);return Math.round((d-today())/86400000)}
  function status(item){if(item.done)return "done";const n=dayDiff(item);if(n<0)return "overdue";if(n<=7)return "soon";return "later"}
  function statusText(item){const n=dayDiff(item),s=status(item);if(s=="done")return tr("done");if(s=="overdue"){const d=-n;return `${tr("overdue")} · ${number(d)} ${plural(d)}`}if(s=="soon"){if(n==0)return `${tr("dueSoon")} · ${tr("dueToday")}`;return `${tr("dueSoon")} · ${number(n)} ${plural(n)}`}return tr("later")}
  function autoTone(item){const n=-dayDiff(item);if(n>=7)return "escalate";if(n>=3)return "reminder";return "gentle"}
  function dueText(item){const n=dayDiff(item),d=-n;if(n<0)return lang()=="ar"?`كان موعد التسليم قبل ${number(d)} ${plural(d,"day")} (${dateText(fromISO(item.due))})`:`${tr("wasDue")} ${number(d)} ${d==1?"day":"days"} ago (${dateText(fromISO(item.due))})`;if(n==0)return lang()=="ar"?"موعد التسليم اليوم": "is due today";return lang()=="ar"?`موعد التسليم في ${dateText(fromISO(item.due))}`:`is due on ${dateText(fromISO(item.due))}`}
  function projectName(id){return state.projects.find(p=>p.id==id)?.name||""}
  function ownerName(item){return item.owner}
  function autoNameTone(item){return autoTone(item)}
  function followTemplate(item,tone){
    const vals={owner:item.owner,deliverable:item.title,project:projectName(item.projectId),dueText:dueText(item)};
    let text;
    if(lang()=="ar"){

  // RENDERING
  function applyTheme(){

  function render(){

    }
    html+=`<header class="topbar"><button class="project-switch" data-action="projects"><span dir="auto" class="bdi">${cur.name}</span>${svg("chevron")}</button><div class="top-actions"><button class="icon-button" data-action="theme" aria-label="${tr("theme")}">${svg(document.documentElement.dataset.theme=="dark"?"sun":"moon")}</button><button class="text-button" data-action="settings">${tr("settings")}</button><button class="text-button top-add" data-action="add">${tr("add")}</button></div></header>`;

    const done=projectItems.filter(i=>status(i)==("done"));
    html+=`<div class="counters"><button class="counter overdue" data-filter="overdue"><strong>${number(overdue.length)}</strong><span>${tr("overdue")}</span></button><button class="counter soon" data-filter="soon"><strong>${number(soon.length)}</strong><span>${tr("dueWeek")}</span></button><button class="counter done" data-filter="done"><strong>${number(done.length)}</strong><span>${tr("done")}</span></button></div>`;
    html+=`<nav class="filters" aria-label="${tr("clear")}"><button class="pill ${state.filter=="all"?"active":""}" data-filter="all">${tr("all")}</button><button class="pill ${state.filter=="overdue"?"active":""}" data-filter="overdue">${tr("overdue")}</button><button class="pill ${state.filter=="soon"?"active":""}" data-filter="soon">${tr("dueSoon")}</button><button class="pill ${state.filter=="mine"?"active":""}" data-filter="mine">${tr("mine")}</button></nav>`;
    if(!projectItems.length)html+=`<div class="empty"><p>${tr("noItems")}</p><button class="primary" data-action="add">${tr("add")}</button><br><button class="link" data-action="load-samples">${tr("loadSamples")}</button></div>`;
    else{
      let shown=projectItems.filter(i=>{
        if(state.filter=="overdue")return status(i)==="overdue";
        if(state.filter=="soon")return status(i)==="soon";
        if(state.filter=="mine")return i.owner.toLocaleLowerCase()==(state.settings.yourName||"").toLocaleLowerCase();
        if(state.filter=="done")return status(i)==="done";
        return true;
      });
      if(!shown.length)html+=`<div class="empty"><p>${tr("noFilter")}</p><button class="secondary" data-action="clear-filter">${tr("clear")}</button></div>`;
      const groups=[["overdue",tr("overdue"),shown.filter(i=>status(i)==="overdue"),false],["soon",tr("dueWeek"),shown.filter(i=>status(i)==="soon"),false],["later",tr("later"),shown.filter(i=>status(i)==="later"),false],["done",tr("done"),shown.filter(i=>status(i)==="done"),true]];
      for(const [key,title,items,collapsed] of groups){
        if(!items.length)continue;
        items.sort((a,b)=>a.due.localeCompare(b.due));
        html+=`<section class="group" data-group="${key}"><div class="group-head"><h2>${title}</h2>${collapsed?`<button class="icon-button" data-toggle-group="${key}" aria-expanded="false">${svg("chevron")}</button>`:""}</div><div class="grid" ${collapsed?'hidden':''}>${items.map(card).join("")}</div></section>`;
      }
    }
    html+=`<button class="floating" data-action="add" aria-label="${tr("add")}">+</button>`;
    document.getElementById("app").innerHTML=html;bindGlobal();
  }
  function card(item){

    return `<article class="card ${st=="overdue"?"overdue":""}" data-id="${item.id}"><button class="card-title" data-action="detail" data-id="${item.id}" dir="auto"><bdi>${item.title}</bdi></button><div class="meta-row"><span class="avatar" aria-hidden="true">${initials(item.owner)}</span><bdi>${item.owner}</bdi></div><div class="meta-row">${svg("calendar")}<time datetime="${item.due}"><bdi>${date}</bdi></time></div><div class="card-bottom"><span class="badge ${st=="overdue"?"overdue":st=="soon"?"soon":st=="done"?"done":""}">${statusText(item)}</span></div><button class="primary follow-btn" data-action="${item.done?"reopen":"follow"}" data-id="${item.id}">${item.done?tr("reopen"):tr("follow")}</button></article>`;

  function deleteProject(id){
    const p=state.projects.find(x=>x.id==id);if(!p)return;
    if(!confirm(tr("projectDeleteConfirm")))return;

    const copy={project:{...p},items:removedItems.map(i=>({...i,followUps:[...i.followUps]}))};
    state.projects=state.projects.filter(x=>x.id!==id);state.items=state.items.filter(i=>i.projectId!==id);
    if(state.settings.currentProjectId==id)state.settings.currentProjectId=state.projects[0]?.id||null;

  function exportJSON(){

    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  async function importJSONFile(file){
    try{
      const data=JSON.parse(await file.text());
      if(data.version!==1||!Array.isArray(data.projects)||!Array.isArray(data.items)||!data.settings)throw Error();
      if(!confirm(tr("importConfirm")))return;
      state.projects=data.projects;
      state.items=data.items;
      state.settings={theme:"system",lang:null,digits:"latn",yourName:"",currentProjectId:null,...data.settings};
      if(!state.projects.some(p=>p.id===state.settings.currentProjectId))state.settings.currentProjectId=state.projects[0]?.id||null;
      state.filter="all";

  function openFollow(item){
    const tone=autoTone(item),text=followTemplate(item,tone);
    openDialog(dialogHead(tr("follow"))+`<div class="tone-row"><button class="tone ${tone=="gentle"?"active":""}" data-tone="gentle">${tr("gentle")}</button><button class="tone ${tone=="reminder"?"active":""}" data-tone="reminder">${tr("reminder")}</button><button class="tone ${tone=="escalate"?"active":""}" data-tone="escalate">${tr("escalate")}</button></div><div class="field" style="margin-top:12px"><label for="message">${tr("title")}</label><textarea id="message">${text.replace(/</g,"&lt;")}</textarea></div><p id="contact-warning" ${item.contact?"hidden":""}>${tr("sendDisabled")} <button class="link" id="edit-contact">${tr("edit")}</button></p><div class="actions"><button class="primary" id="send-follow" ${item.contact?"":"disabled"}>${tr("send")}</button><button class="secondary" id="copy-follow">${tr("copy")}</button></div><div id="follow-result" aria-live="polite"></div>`,d=>{
      d.querySelectorAll("[data-tone]").forEach(b=>b.onclick=()=>{d.querySelectorAll("[data-tone]").forEach(x=>x.classList.remove("active"));b.classList.add("active");d.querySelector("#message").value=followTemplate(item,b.dataset.tone)});
      d.querySelector("#edit-contact").onclick=()=>{closeDialog();openItemForm(item)};
      d.querySelector("#copy-follow").onclick=async()=>copyMessage(d.querySelector("#message"));
      d.querySelector("#send-follow").onclick=async()=>{
        const message=d.querySelector("#message").value,selectedTone=d.querySelector("[data-tone].active").dataset.tone;
        try{
          if(navigator.share)await navigator.share({text:message});
          else{
            const subject=lang()=="ar"?`متابعة: ${item.title}`:`Follow-up: ${item.title}`;
            const c=item.contact.trim();
            if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c))location.href=`mailto:${encodeURIComponent(c)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(message)}`;
            else if(/^[+]?[\d\s().-]{7,}$/.test(c))location.href=`sms:${encodeURIComponent(c)}?&body=${encodeURIComponent(message)}`;
            else throw Error("no contact");
          }
          askSent(item,selectedTone,d);
        }catch(e){d.querySelector("#follow-result").innerHTML=`<p>${tr("shareCancel")}</p><button class="secondary" id="copy-instead">${tr("copy")}</button>`;d.querySelector("#copy-instead").onclick=()=>copyMessage(d.querySelector("#message"))}
      };
    });
  }
  function askSent(item,tone,d){
    d.querySelector("#follow-result").innerHTML=`<p>${tr("didSend")}</p><div class="actions"><button class="primary" id="sent-yes">${tr("yes")}</button><button class="secondary" id="sent-no">${tr("notYet")}</button></div>`;
    d.querySelector("#sent-yes").onclick=()=>{item.followUps.push({at:new Date().toISOString(),tone});save();announce(tr("sent"));closeDialog();render()};
    d.querySelector("#sent-no").onclick=()=>closeDialog();
  }
  async function copyMessage(textarea){
    try{await navigator.clipboard.writeText(textarea.value);announce(tr("copied"))}
    catch(e){
      textarea.focus();textarea.select();
      try{document.execCommand("copy");announce(tr("copied"))}
      catch(e2){const result=document.querySelector("#follow-result");if(result)result.textContent=tr("copyFail")}
    }
  }
  function deleteItem(item){
    if(!confirm(tr("deleteConfirm")))return;
    const copy={...item,followUps:[...item.followUps]};
    state.items=state.items.filter(i=>i.id!==item.id);save();closeDialog();showUndo(tr("undoItem"),()=>{state.items.push(copy);save();render()});render();
  }
  function showUndo(message,undo){
    if(undoTimer)clearTimeout(undoTimer);const old=document.querySelector(".undo-bar");if(old)old.remove();
    undoAction=undo;const bar=document.createElement("div");bar.className="undo-bar";bar.setAttribute("role","status");bar.innerHTML=`<span>${message}</span><button class="link" id="undo">${tr("undo")}</button>`;
    document.body.appendChild(bar);bar.querySelector("#undo").onclick=()=>{undoAction();undoAction=null;bar.remove();clearTimeout(undoTimer)};
    undoTimer=setTimeout(()=>{bar.remove();undoAction=null},5000);
  }
  function announce(text){const live=document.getElementById("live");live.textContent="";setTimeout(()=>live.textContent=text,10)}
  function onAction(e){
    const el=e.currentTarget,a=el.dataset.action,id=el.dataset.id;
    if(a=="projects")openProjects();
    else if(a=="theme"){state.settings.theme=document.documentElement.dataset.theme=="dark"?"light":"dark";save();applyTheme();render()}
    else if(a=="settings")openSettings();
    else if(a=="add")openItemForm();
    else if(a=="detail")openDetail(id);
    else if(a=="follow"){const item=state.items.find(i=>i.id==id);if(item)openFollow(item)}
    else if(a=="reopen"){const item=state.items.find(i=>i.id==id);if(item){item.done=false;item.doneAt=null;save();render()}}
    else if(a=="clear-filter"){state.filter="all";render()}
    else if(a=="load-samples"){stateLoadSamples();save();render()}
    else if(a=="dismiss-banner"){storageBlocked=false;render()}
    else if(a=="start-fresh"){unreadable=false;stateLoadSamples();save();render()}
  }
  document.addEventListener("keydown",e=>{
    if(e.key=="Escape"&&openModal){e.preventDefault();closeDialog()}
  });
  document.addEventListener("keydown",e=>{
    if(e.key=="Tab"&&openModal){
      const focusable=[...openModal.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')];
      if(!focusable.length)return;
      const first=focusable[0],last=focusable[focusable.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
    }
  });
  load();render();save();
  </script>
</body>
</html>
